<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hiroki Yoga レッスン予約</title>

  <style>
    /* ============================================
       リセット & ベース
       ============================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-yellow: #FFD166;
      --light-yellow: #FFF8E7;
      --dark-yellow: #E6B84D;
      --white: #FFFFFF;
      --black: #1A1A1A;
      --gray: #666666;
      --light-gray: #F5F5F5;
      --border: #E0E0E0;
      --success: #4CAF50;
      --error: #F44336;
    }

    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.8;
      color: var(--black);
      background: linear-gradient(135deg, var(--light-yellow) 0%, var(--white) 100%);
      padding: 20px;
      min-height: 100vh;
    }

    /* ============================================
       コンテナ
       ============================================ */
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--white);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      padding: 32px 24px;
    }

    /* ============================================
       ヘッダー
       ============================================ */
    .header {
      text-align: center;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 2px solid var(--primary-yellow);
    }

    .header h1 {
      font-family: 'Noto Serif JP', serif;
      font-size: 1.75rem;
      margin-bottom: 8px;
      color: var(--black);
    }

    .header p {
      color: var(--gray);
      font-size: 0.95rem;
    }

    /* ============================================
       フォーム
       ============================================ */
    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--black);
      font-size: 0.95rem;
    }

    .form-group label .required {
      color: var(--error);
      margin-left: 4px;
    }

    .form-group input[type="text"],
    .form-group input[type="email"],
    .form-group input[type="tel"],
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.3s ease;
      background: var(--white);
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary-yellow);
      box-shadow: 0 0 0 3px rgba(255, 209, 102, 0.2);
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-group .helper-text {
      font-size: 0.85rem;
      color: var(--gray);
      margin-top: 6px;
    }

    /* ============================================
       ボタン
       ============================================ */
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: var(--primary-yellow);
      color: var(--black);
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(255, 209, 102, 0.3);
      font-family: inherit;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--dark-yellow);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 209, 102, 0.4);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ============================================
       メッセージ
       ============================================ */
    .message {
      padding: 16px 20px;
      border-radius: 8px;
      margin-bottom: 24px;
      display: none;
      animation: slideDown 0.3s ease;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #E8F5E9;
      border-left: 4px solid var(--success);
      color: #2E7D32;
    }

    .message.error {
      background: #FFEBEE;
      border-left: 4px solid var(--error);
      color: #C62828;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ============================================
       ローディング
       ============================================ */
    .loading {
      display: none;
      text-align: center;
      margin: 20px 0;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      border: 3px solid var(--light-gray);
      border-top: 3px solid var(--primary-yellow);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ============================================
       レスポンシブ
       ============================================ */
    @media (max-width: 640px) {
      body {
        padding: 12px;
      }

      .container {
        padding: 24px 16px;
      }

      .header h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- ヘッダー -->
    <div class="header">
      <h1>レッスン予約フォーム</h1>
      <p>ゆっくり深く、自分を知るヨガ</p>
    </div>

    <!-- メッセージ表示エリア -->
    <div id="message" class="message"></div>

    <!-- ローディング -->
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p style="margin-top: 12px; color: var(--gray);">送信中...</p>
    </div>

    <!-- フォーム -->
    <form id="reservationForm">
      <!-- お名前 -->
      <div class="form-group">
        <label for="name">お名前<span class="required">*</span></label>
        <input type="text" id="name" name="name" required placeholder="山田 太郎">
      </div>

      <!-- メールアドレス -->
      <div class="form-group">
        <label for="email">メールアドレス<span class="required">*</span></label>
        <input type="email" id="email" name="email" required placeholder="example@mail.com">
        <div class="helper-text">予約確認のメールをお送りします</div>
      </div>

      <!-- お電話番号 -->
      <div class="form-group">
        <label for="phone">お電話番号<span class="required">*</span></label>
        <input type="tel" id="phone" name="phone" required placeholder="090-1234-5678">
      </div>

      <!-- 希望日時（第1希望） -->
      <div class="form-group">
        <label for="datetime1">希望日時（第1希望）<span class="required">*</span></label>
        <input type="text" id="datetime1" name="datetime1" required placeholder="例：12月15日（日）15:00">
        <div class="helper-text">レッスンは日曜日15:00〜、月2回開催</div>
      </div>

      <!-- 希望日時（第2希望） -->
      <div class="form-group">
        <label for="datetime2">希望日時（第2希望）</label>
        <input type="text" id="datetime2" name="datetime2" placeholder="例：12月22日（日）15:00">
      </div>

      <!-- レッスン形式 -->
      <div class="form-group">
        <label for="lessonType">レッスン形式<span class="required">*</span></label>
        <select id="lessonType" name="lessonType" required>
          <option value="">選択してください</option>
          <option value="グループレッスン（2,500円）">グループレッスン（2,500円）</option>
          <option value="個人レッスン（応相談）">個人レッスン（応相談）</option>
        </select>
      </div>

      <!-- メッセージ -->
      <div class="form-group">
        <label for="message">メッセージ・ご質問など</label>
        <textarea id="message" name="message" placeholder="ヨガ経験、ご質問など、ご自由にお書きください"></textarea>
      </div>

      <!-- 送信ボタン -->
      <button type="submit" class="btn-submit" id="submitBtn">予約を送信</button>
    </form>
  </div>

  <script>
    // フォーム送信処理
    document.getElementById('reservationForm').addEventListener('submit', function(e) {
      e.preventDefault();

      // ボタンとローディングの制御
      const submitBtn = document.getElementById('submitBtn');
      const loading = document.getElementById('loading');
      const messageDiv = document.getElementById('message');

      submitBtn.disabled = true;
      loading.classList.add('show');
      messageDiv.classList.remove('show');

      // フォームデータ取得
      const formData = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        datetime1: document.getElementById('datetime1').value,
        datetime2: document.getElementById('datetime2').value,
        lessonType: document.getElementById('lessonType').value,
        message: document.getElementById('message').value
      };

      // GASに送信
      google.script.run
        .withSuccessHandler(function(response) {
          loading.classList.remove('show');
          submitBtn.disabled = false;

          if (response.success) {
            messageDiv.textContent = response.message;
            messageDiv.className = 'message success show';
            // フォームをリセット
            document.getElementById('reservationForm').reset();
          } else {
            messageDiv.textContent = response.message;
            messageDiv.className = 'message error show';
          }

          // 3秒後にメッセージを消す
          setTimeout(() => {
            messageDiv.classList.remove('show');
          }, 5000);
        })
        .withFailureHandler(function(error) {
          loading.classList.remove('show');
          submitBtn.disabled = false;
          messageDiv.textContent = '送信に失敗しました。お手数ですがInstagramからお問い合わせください。';
          messageDiv.className = 'message error show';
          console.error('エラー:', error);
        })
        .submitForm(formData);
    });
  </script>
</body>
</html>
