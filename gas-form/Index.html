<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hiroki Yoga レッスン予約</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* ============================================
       リセット & ベース
       ============================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-yellow: #FFD166;
      --light-yellow: #FFF8E7;
      --dark-yellow: #E6B84D;
      --white: #FFFFFF;
      --black: #1A1A1A;
      --gray: #666666;
      --light-gray: #F5F5F5;
      --border: #E0E0E0;
      --success: #4CAF50;
      --error: #F44336;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 400;
      line-height: 1.8;
      color: var(--black);
      background: linear-gradient(135deg, var(--light-yellow) 0%, var(--white) 100%);
      padding: 40px 20px;
      min-height: 100vh;
    }

    /* ============================================
       コンテナ
       ============================================ */
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: var(--white);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 50px 40px;
    }

    @media (max-width: 640px) {
      body {
        padding: 20px 12px;
      }
      .container {
        padding: 32px 24px;
      }
    }

    /* ============================================
       ヘッダー
       ============================================ */
    .header {
      text-align: center;
      margin-bottom: 50px;
      padding-bottom: 30px;
      border-bottom: 3px solid var(--primary-yellow);
    }

    .header h1 {
      font-family: 'Noto Serif JP', serif;
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--black);
      line-height: 1.4;
    }

    .header p {
      color: var(--gray);
      font-size: 1rem;
      font-weight: 300;
    }

    /* ============================================
       フォーム
       ============================================ */
    .form-group {
      margin-bottom: 28px;
    }

    .form-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 10px;
      color: var(--black);
      font-size: 0.95rem;
    }

    .form-group label .required {
      color: var(--error);
      margin-left: 4px;
      font-size: 0.9rem;
    }

    .form-group input[type="text"],
    .form-group input[type="email"],
    .form-group input[type="tel"],
    .form-group input[type="date"],
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.3s ease;
      background: var(--white);
      color: var(--black);
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary-yellow);
      box-shadow: 0 0 0 3px rgba(255, 209, 102, 0.15);
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.6;
    }

    .form-group .helper-text {
      font-size: 0.85rem;
      color: var(--gray);
      margin-top: 8px;
      line-height: 1.5;
    }

    /* ============================================
       ボタン
       ============================================ */
    .btn-submit {
      width: 100%;
      padding: 18px 24px;
      background: var(--primary-yellow);
      color: var(--black);
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(255, 209, 102, 0.3);
      font-family: inherit;
      margin-top: 20px;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--dark-yellow);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 209, 102, 0.4);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ============================================
       メッセージ
       ============================================ */
    .message {
      padding: 16px 20px;
      border-radius: 8px;
      margin-bottom: 24px;
      display: none;
      animation: slideDown 0.3s ease;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #E8F5E9;
      border-left: 4px solid var(--success);
      color: #2E7D32;
    }

    .message.error {
      background: #FFEBEE;
      border-left: 4px solid var(--error);
      color: #C62828;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ============================================
       モーダル
       ============================================ */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: var(--white);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: var(--primary-yellow);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }

    .modal h2 {
      font-family: 'Noto Serif JP', serif;
      font-size: 1.75rem;
      margin-bottom: 16px;
      color: var(--black);
    }

    .modal p {
      color: var(--gray);
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .modal-btn {
      padding: 14px 40px;
      background: var(--primary-yellow);
      color: var(--black);
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .modal-btn:hover {
      background: var(--dark-yellow);
      transform: translateY(-2px);
    }

    /* ============================================
       ローディング
       ============================================ */
    .loading {
      display: none;
      text-align: center;
      margin: 30px 0;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      border: 3px solid var(--light-gray);
      border-top: 3px solid var(--primary-yellow);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading p {
      margin-top: 16px;
      color: var(--gray);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- ヘッダー -->
    <div class="header">
      <h1>レッスン予約フォーム</h1>
      <p>ゆっくり深く、自分を知るヨガ</p>
    </div>

    <!-- メッセージ表示エリア -->
    <div id="message" class="message"></div>

    <!-- ローディング -->
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>送信中...</p>
    </div>

    <!-- フォーム -->
    <form id="reservationForm">
      <!-- お名前 -->
      <div class="form-group">
        <label for="name">お名前<span class="required">*</span></label>
        <input type="text" id="name" name="name" required placeholder="山田 太郎">
      </div>

      <!-- メールアドレス -->
      <div class="form-group">
        <label for="email">メールアドレス<span class="required">*</span></label>
        <input type="email" id="email" name="email" required placeholder="example@mail.com">
        <div class="helper-text">予約確認のメールをお送りします</div>
      </div>

      <!-- お電話番号 -->
      <div class="form-group">
        <label for="phone">お電話番号<span class="required">*</span></label>
        <input type="tel" id="phone" name="phone" required placeholder="090-1234-5678">
      </div>

      <!-- 希望日時（第1希望） -->
      <div class="form-group">
        <label for="datetime1">希望日時（第1希望）<span class="required">*</span></label>
        <input type="date" id="datetime1" name="datetime1" required>
        <div class="helper-text">レッスンは日曜日15:00〜、月2回開催。日曜日を選択してください。</div>
      </div>

      <!-- 希望日時（第2希望） -->
      <div class="form-group">
        <label for="datetime2">希望日時（第2希望）</label>
        <input type="date" id="datetime2" name="datetime2">
        <div class="helper-text">第2希望がある場合は選択してください（任意）</div>
      </div>

      <!-- レッスン形式 -->
      <div class="form-group">
        <label for="lessonType">レッスン形式<span class="required">*</span></label>
        <select id="lessonType" name="lessonType" required>
          <option value="">選択してください</option>
          <option value="グループレッスン（2,500円）">グループレッスン（2,500円）</option>
          <option value="個人レッスン（応相談）">個人レッスン（応相談）</option>
        </select>
      </div>

      <!-- メッセージ -->
      <div class="form-group">
        <label for="message">メッセージ・ご質問など</label>
        <textarea id="message" name="message" placeholder="ヨガ経験、ご質問など、ご自由にお書きください"></textarea>
      </div>

      <!-- 送信ボタン -->
      <button type="submit" class="btn-submit" id="submitBtn">予約を送信</button>
    </form>
  </div>

  <!-- 成功モーダル -->
  <div id="successModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-icon">✓</div>
      <h2>予約を受け付けました</h2>
      <p>ご予約ありがとうございます。<br>確認のメールをお送りしましたので、ご確認ください。<br><br>日程調整の上、改めてご連絡させていただきます。</p>
      <button class="modal-btn" onclick="closeModal()">閉じる</button>
    </div>
  </div>

  <script>
    // 日曜日のみ選択可能にする（オプション：警告表示）
    const dateInputs = document.querySelectorAll('input[type="date"]');
    dateInputs.forEach(input => {
      input.addEventListener('change', function() {
        const selectedDate = new Date(this.value);
        if (selectedDate.getDay() !== 0) { // 0 = 日曜日
          alert('レッスンは日曜日のみ開催しています。日曜日を選択してください。');
          this.value = '';
        }
      });
    });

    // モーダルを閉じる
    function closeModal() {
      document.getElementById('successModal').classList.remove('show');
      document.getElementById('reservationForm').reset();
    }

    // フォーム送信処理
    document.getElementById('reservationForm').addEventListener('submit', function(e) {
      e.preventDefault();

      // ボタンとローディングの制御
      const submitBtn = document.getElementById('submitBtn');
      const loading = document.getElementById('loading');
      const messageDiv = document.getElementById('message');

      submitBtn.disabled = true;
      loading.classList.add('show');
      messageDiv.classList.remove('show');

      // 日付をフォーマット
      const datetime1 = document.getElementById('datetime1').value;
      const datetime2 = document.getElementById('datetime2').value;

      const formatDate = (dateStr) => {
        if (!dateStr) return '';
        const date = new Date(dateStr);
        const month = date.getMonth() + 1;
        const day = date.getDate();
        const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
        const weekday = weekdays[date.getDay()];
        return `${month}月${day}日（${weekday}）15:00`;
      };

      // フォームデータ取得
      const formData = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        datetime1: formatDate(datetime1),
        datetime2: formatDate(datetime2),
        lessonType: document.getElementById('lessonType').value,
        message: document.getElementById('message').value
      };

      // GASに送信
      google.script.run
        .withSuccessHandler(function(response) {
          loading.classList.remove('show');
          submitBtn.disabled = false;

          if (response.success) {
            // 成功モーダルを表示
            document.getElementById('successModal').classList.add('show');
          } else {
            messageDiv.textContent = response.message;
            messageDiv.className = 'message error show';
            // ページトップにスクロール
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        })
        .withFailureHandler(function(error) {
          loading.classList.remove('show');
          submitBtn.disabled = false;
          messageDiv.textContent = '送信に失敗しました。お手数ですがInstagramからお問い合わせください。';
          messageDiv.className = 'message error show';
          // ページトップにスクロール
          window.scrollTo({ top: 0, behavior: 'smooth' });
          console.error('エラー:', error);
        })
        .submitForm(formData);
    });

    // モーダルの外側クリックで閉じる
    document.getElementById('successModal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeModal();
      }
    });
  </script>
</body>
</html>
